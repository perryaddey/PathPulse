[platformio]
default_envs = esp32-c3-devkitm-1

[env]
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit DRV2605 Library @ 1.2.4

; Normal wristband entry point, ready for future BLE integration.
[env:esp32-c3-devkitm-1]
build_src_filter = +<*> -<vibration_test.cpp>

; Interactive hardware test: send ASCII digits 0-8 through Serial Monitor.
[env:vibration-test]
build_src_filter = +<*> -<main.cpp>
