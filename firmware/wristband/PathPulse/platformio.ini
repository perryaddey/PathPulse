[platformio]
default_envs = esp32-c3-devkitm-1

[env]
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit DRV2605 Library @ 1.2.4

; Normal wristband entry point with BLE command reception.
[env:esp32-c3-devkitm-1]
build_src_filter = +<*> -<vibration_test.cpp> -<motor_diagnostic.cpp>

; Same firmware and command protocol, advertising the right wristband name.
[env:wristband-right]
build_src_filter = +<*> -<vibration_test.cpp> -<motor_diagnostic.cpp>
build_flags = -D PATHPULSE_DEVICE_NAME=\"PathPulse-Right\"

; Interactive hardware test: send ASCII digits 0-8 through Serial Monitor.
[env:vibration-test]
build_src_filter = +<*> -<main.cpp> -<wristband_ble.cpp> -<motor_diagnostic.cpp>

; Isolated, manually triggered, single-pulse open-loop motor diagnostic. No BLE.
[env:motor-diagnostic]
build_src_filter = -<*> +<motor_diagnostic.cpp>
lib_ignore = Adafruit DRV2605 Library, Adafruit BusIO
